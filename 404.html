<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | Anup Parajuli</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(#f0f7ff, #e3f2fd);
      color: #1e3a5f;
      font: 1rem/1.6 system-ui, sans-serif;
    }

    header {
      background: linear-gradient(135deg, #2c5aa0 0%, #1e4a7a 100%);
      color: white; padding: 2.75rem 2rem 2rem; text-align: center;
      position: relative; overflow: hidden; border-bottom: 3px solid #4a90e2;
    }
    .dna-strand { position: absolute; width: 100%; height: 150px; top: 0; left: 0; opacity: 0.1; overflow: hidden; }
    .helix { position: absolute; width: 4px; height: 60px; background: #4a90e2; animation: spiral 8s linear infinite; }
    .helix:nth-child(1) { left: 20%; animation-delay: 0s; }
    .helix:nth-child(2) { left: 40%; animation-delay: -2s; }
    .helix:nth-child(3) { left: 60%; animation-delay: -4s; }
    .helix:nth-child(4) { left: 80%; animation-delay: -6s; }
    @keyframes spiral { 0% { transform: translateY(-60px) rotate(0deg); } 100% { transform: translateY(200px) rotate(360deg); } }
    .site-name { font-size: 2.65rem; line-height: 1.2; margin-bottom: 0.45rem; font-weight: 600; letter-spacing: -0.5px; position: relative; z-index: 1; }
    .tagline { font-size: 1.1rem; color: #b3d9ff; font-weight: 400; letter-spacing: 0.5px; position: relative; z-index: 1; }

    footer { background: linear-gradient(135deg,#1e4a7a 0%,#2c5aa0 100%); color: #b3d9ff; text-align: center; padding: 1.5rem 1rem; border-top: 3px solid #4a90e2; }

    header p:not(.site-name), footer p { margin: 0; }
    .site-name { margin-top: 0; }

    @media (max-width: 768px) {
      .site-name { font-size: 2rem; }
      .tagline { font-size: 0.95rem; }
    }

    @media (max-width: 480px) {
      header { padding: 2rem 1rem 1.25rem; }
      .site-name { font-size: 1.6rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .helix { animation: none; }
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 1.5rem 1rem 1.25rem;
    }

    .error-card {
      max-width: 34rem;
      padding: clamp(1.25rem, 3vw, 2rem);
      border: 1px solid #d4e6f7;
      border-radius: 1rem;
      background: white;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      line-height: 1.2;
    }

    a {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.65rem 1.1rem;
      border-radius: 0.4rem;
      background: #2c5aa0;
      color: white;
      font-weight: 600;
    }

    a:hover { background: #1e4a7a; }
    a:focus-visible { outline: 3px solid #2c5aa0; outline-offset: 4px; }
  </style>
</head>
<body>
  <header>
    <div class="dna-strand" aria-hidden="true">
      <div class="helix"></div><div class="helix"></div><div class="helix"></div><div class="helix"></div>
    </div>
    <p class="site-name">Anup Parajuli</p>
    <p class="tagline">Ph.D. Student | Molecular Genetics | The Ohio State University</p>
    <p>Learning and Growing.....Life is a Journey</p>
  </header>
  <main>
    <div class="error-card">
      <h1>Sorry, page not found.</h1>
      <p>The page you’re looking for may have moved, or the address may have been mistyped.</p>
      <a href="/">Back to homepage</a>
    </div>
  </main>
  <footer>
    <p>© 2026 Anup Parajuli · All rights reserved</p>
  </footer>
</body>
</html>
