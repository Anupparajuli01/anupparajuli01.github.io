<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | Anup Parajuli</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      box-sizing: border-box;
      background: linear-gradient(#f0f7ff, #e3f2fd);
      color: #1e3a5f;
      font: 1rem/1.6 system-ui, sans-serif;
    }

    main {
      max-width: 34rem;
      padding: clamp(1.5rem, 5vw, 3rem);
      border: 1px solid #d4e6f7;
      border-radius: 1rem;
      background: white;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      line-height: 1.2;
    }

    a {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.65rem 1.1rem;
      border-radius: 0.4rem;
      background: #2c5aa0;
      color: white;
      font-weight: 600;
    }

    a:hover { background: #1e4a7a; }
    a:focus-visible { outline: 3px solid #2c5aa0; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Sorry, page not found.</h1>
    <p>The page you’re looking for may have moved, or the address may have been mistyped.</p>
    <a href="/">Back to homepage</a>
  </main>
</body>
</html>
